name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux clipboard deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      # A tag can be pushed at any commit, including one CI never went green
      # on. Shipping a binary that fails its own tests is worse than shipping
      # nothing, so the gate is here rather than only on the main branch.
      # Skipped when cross-compiling, where the binaries cannot be run.
      - name: Test
        if: matrix.target != 'x86_64-apple-darwin'
        run: cargo test --workspace --release --target ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p jot-cli

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../jot-${{ matrix.target }}.tar.gz jot
          cd -
          sha256sum jot-${{ matrix.target }}.tar.gz > jot-${{ matrix.target }}.tar.gz.sha256

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/jot.exe -DestinationPath jot-${{ matrix.target }}.zip
          (Get-FileHash jot-${{ matrix.target }}.zip -Algorithm SHA256).Hash.ToLower() + "  jot-${{ matrix.target }}.zip" | Out-File -Encoding ascii jot-${{ matrix.target }}.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: jot-${{ matrix.target }}
          path: |
            jot-${{ matrix.target }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
