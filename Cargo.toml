[workspace]
resolver = "2"
members = ["crates/jot-core", "crates/jot-cli"]

[workspace.package]
authors = ["Terry Li"]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Longao5k/jotbook"
homepage = "https://github.com/Longao5k/jotbook"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
toml = "0.8"
dirs = "5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
