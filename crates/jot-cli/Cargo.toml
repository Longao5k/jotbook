[package]
name = "jot-cli"
description = "A notebook for your own commands, one keypress away"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["cli", "shell", "snippets", "terminal", "productivity"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "jot"
path = "src/main.rs"

[dependencies]
jot-core = { path = "../jot-core" }
anyhow.workspace = true
clap = { version = "4", features = ["derive"] }
ratatui = "0.29"
fuzzy-matcher = "0.3"
arboard = { version = "3", default-features = false }
# Truncation counts terminal columns, not characters: a CJK character is two columns wide
unicode-width = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
    "Win32_System_Console",
    "Win32_Globalization",
] }

